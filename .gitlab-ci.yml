stages:
  - build_and_test

cache:
  key: "$CI_COMMIT_REF_SLUG-$CI_JOB_NAME"
  paths:
    - build/
  policy: pull-push

build-test:
  stage: build_and_test
  image: $IMAGE
  tags:
    - $TAG
  parallel:
    matrix:
      - IMAGE: ["ubuntu:24.04", "debian:bookworm"]
        TAG: ["elrunner"]
      - IMAGE: ["ubuntu:24.04", "debian:bookworm"]
        TAG: ["hawk"]
  script:
    - |
      if [ -f /etc/debian_version ]; then
        apt-get update && apt-get install -y build-essential cmake python3
      fi
    - cmake -B build -DCMAKE_CXX_STANDARD=17
    - cmake --build build --config Release
    - ctest --test-dir build --output-on-failure -C Release --output-junit build/test-results.xml
  artifacts:
    when: always
    paths:
      - build/
    reports:
      junit: build/test-results.xml
    expire_in: 14 days