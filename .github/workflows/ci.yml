name: DataConverter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ matrix.os }}-build-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.os }}-build-

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake python3

      - name: Install deps (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake python3 -y

      - name: Clean build directory
        run: rm -rf build
        
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests and save log
        run: |
          ctest --test-dir build --output-on-failure -C Release > build/test-log.txt 2>&1 || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.os }}
          path: |
            build/
            !build/CMakeFiles/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: build/test-log.txt
          if-no-files-found: warn
          retention-days: 14